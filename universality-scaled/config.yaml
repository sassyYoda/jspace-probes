# A+G extension (GPU phase): 7-model universality grid + corpus-grid growth.
# Part 1 (extend_a.py): 7x7 pairwise RSA, norm-scaled convention, unembed +
#   shuffled-x3 baselines, shard-wise unembedding fetch (no full model downloads).
# Part 2 (fit_corpus.py + compare_corpus.py): two new lens fits (GPU)
#   (qwen3-1.7b on chat text, gemma-2-2b on code), corpus-grid RSA rows.

